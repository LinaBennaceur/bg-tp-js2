
<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="table_container">
	<!-- id : identifiant utilisé par JS pour retrouver l'élément avec getElementById (slides 61 à 64) -->
        <table id="table_persons">
            <tr>
                <th class="col_num">N</th>
                <th class="col_S">Nom</th>
                <th class="col_S">Prenom</th>
                <th class="col_num">Points</th>
                <th class="col_chkbox">Select</th>
            </tr>
            <tr>
                <td class="col_num">1</td>
                <td class="col_S">Nom1</td>
                <td class="col_S">Prnom1</td>
                <td class="col_num">5</td>
                <td class="col_chkbox"><input type="checkbox"/></td>
            </tr>
            <tr>
                <td class="col_num">2</td>
                <td class="col_S">Nom2</td>
                <td class="col_S">Prnom2</td>
                <td class="col_num">10</td>
                <td class="col_chkbox"><input type="checkbox"/></td>
            </tr>
            <tr>
                <td class="col_num">3</td>
                <td class="col_S">Nom3</td>
                <td class="col_S">Prnom3</td>
                <td class="col_num">15</td>
                <td class="col_chkbox"><input type="checkbox"/></td>
            </tr>
        </table>
		<!-- onclick : événement "au clic" qui appelle une fonction JS (slides 22 et 129 à 135) -->
        <button onclick="doInsertRowTable(99, 'nom', 'prenom', 10)">Ajouter</button>
        <button onclick="consoleTableau()">Console Tableau</button>
    </div>
	<!-- Script JS externe (slide 24) placé à la fin du body, pour que le DOM soit chargé avant son exécution (slides 23, 26 et 27) -->
    <script src="script3.js"></script>
</body>
</html>
